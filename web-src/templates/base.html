<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site_name }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand__logo">{{ site_name[:1] | upper }}</div>
          <div class="brand__meta">
            <div class="brand__name">{{ site_name }}</div>
            <div class="brand__tag">Sandboxed</div>
          </div>
        </div>

        <nav class="nav">
          <a class="nav__item {% if active == 'dashboard' %}is-active{% endif %}" href="/dashboard">
            <span class="nav__dot"></span> Dashboard
          </a>
          <a class="nav__item {% if active == 'search' %}is-active{% endif %}" href="/dashboard">
            <span class="nav__dot"></span> Search
          </a>
          <a class="nav__item {% if active == 'scan' %}is-active{% endif %}" href="/dashboard">
            <span class="nav__dot"></span> Scan
          </a>
          <a class="nav__item {% if active == 'builder' %}is-active{% endif %}" href="/dashboard">
            <span class="nav__dot"></span> String Builder
          </a>
          <a class="nav__item {% if active == 'docs' %}is-active{% endif %}" href="/dashboard">
            <span class="nav__dot"></span> Docs
          </a>
          <a class="nav__item {% if active == 'faq' %}is-active{% endif %}" href="/dashboard">
            <span class="nav__dot"></span> FAQ
          </a>
          <a class="nav__item {% if active == 'pricing' %}is-active{% endif %}" href="/dashboard">
            <span class="nav__dot"></span> Pricing
          </a>
          <a class="nav__item {% if active == 'settings' %}is-active{% endif %}" href="/dashboard">
            <span class="nav__dot"></span> Settings
          </a>
        </nav>

        {% if user %}
        <div class="sidebar__footer">
          <div class="userpill">
            {% if user.avatar_url %}
              <img class="userpill__avatar" src="{{ user.avatar_url }}" alt="avatar" />
            {% else %}
              <div class="userpill__avatar userpill__avatar--fallback">{{ user.username[:1] | upper }}</div>
            {% endif %}
            <div class="userpill__meta">
              <div class="userpill__name">{{ user.username }}</div>
              <div class="userpill__sub">Discord locked</div>
            </div>
          </div>
          <a class="btn btn--ghost" href="/logout">Logout</a>
        </div>
        {% endif %}
      </aside>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
