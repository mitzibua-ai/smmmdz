name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      
      # Copy only public website files to the Pages artifact
      - name: Prepare Pages content
        run: |
          mkdir -p _site
          mkdir -p _site/downloads
          cp web/index.html _site/
          cp web/404.html _site/ 2>/dev/null || true
          cp web/login.html _site/
          cp web/callback.html _site/
          cp web/dashboard.html _site/
          cp -r web/css _site/
          cp -r web/js _site/
          cp -r web/static _site/
          cp -r web/login _site/
          cp -r web/callback _site/
          cp -r web/dashboard _site/
          cp web/downloads/dotx-pc-check.exe _site/downloads/ 2>/dev/null || true
          cp .nojekyll _site/ || true
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
