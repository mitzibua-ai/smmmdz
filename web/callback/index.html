<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <title>dotx — Callback</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/site-protect.css" />
    <script src="/js/site-guard.js"></script>
  </head>
  <body>
    <div id="callback-screen">
      <div class="login-bg" aria-hidden="true">
        <div class="login-bg__orb login-bg__orb--red"></div>
        <div class="login-bg__orb login-bg__orb--cyan"></div>
      </div>
      <div class="callback-panel">
        <div class="callback-mark">dot<span>x</span></div>
        <div class="callback-status" id="callback-status">Connecting your Discord account…</div>
        <div id="callback-error" class="alert hidden"></div>
        <a id="callback-back" class="btn btn--ghost hidden" href="/login/" style="margin-top:16px">Back to login</a>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api-base.js"></script>
    <script src="/js/pkce.js"></script>
    <script src="/js/discord-profile.js"></script>
    <script src="/js/discord-license.js"></script>
    <script src="/js/discord-oauth.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/callback.js"></script>
  </body>
</html>
